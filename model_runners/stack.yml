services:
  runner:
    image: ghcr.io/leg3/svraas-runner@sha256:a05430dd71f7a30603a324876880eb585c7f3270022a38e5117696d4ca33418b

    environment:
      SVRAAS_ARTIFACT_ROOT: /artifacts
      SVRAAS_CHECK_INTERVAL: "60"
      SVRAAS_RETRY_INTERVAL: "3600"

    secrets:
      - fred_key

    volumes:
      - artifacts:/artifacts

    deploy:
      replicas: 1

      restart_policy:
        condition: any
        delay: 5s

      update_config:
        parallelism: 1
        order: stop-first

volumes:
  artifacts:
    driver: local
    driver_opts:
      type: nfs
      o: addr=127.0.0.1,nfsvers=4.1,rw
      device: :/artifacts

secrets:
  fred_key:
    external: true
