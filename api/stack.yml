services:
  api:
    image: ghcr.io/leg3/svraas-api@sha256:66babc2c7e28ba8cfbb71f0c43e65936e69329b54f2c9da4f4e9f66f4c906c72

    environment:
      SVRAAS_ARTIFACT_ROOT: /artifacts

    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress

    volumes:
      - artifacts:/artifacts:ro

    networks:
      - default
      - api-php-bridge

    deploy:
      replicas: 3

      placement:
        max_replicas_per_node: 1

      restart_policy:
        condition: any
        delay: 5s

      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback

      rollback_config:
        parallelism: 1
        order: stop-first

volumes:
  artifacts:
    driver: local
    driver_opts:
      type: nfs
      o: addr=127.0.0.1,nfsvers=4.1,ro
      device: :/artifacts

networks:
  default: {}
  api-php-bridge:
    external: true
