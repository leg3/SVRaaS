services:
  api:
    image: ghcr.io/leg3/svraas-api@sha256:495f1416d5f4a33e8ff6df45cf4182ca4efcc6bd1ed737e7738e4ca865973b77

    environment:
      SVRAAS_ARTIFACT_ROOT: /artifacts

    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress

    volumes:
      - artifacts:/artifacts:ro

    deploy:
      replicas: 3

      placement:
        max_replicas_per_node: 1

      restart_policy:
        condition: any
        delay: 5s

      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback

      rollback_config:
        parallelism: 1
        order: stop-first

volumes:
  artifacts:
    driver: local
    driver_opts:
      type: nfs
      o: addr=127.0.0.1,nfsvers=4.1,ro
      device: :/artifacts
